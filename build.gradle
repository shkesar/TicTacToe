plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
        }
    }
}

javafx {
    version = '21.0.1'
    modules = ['javafx.controls']
}

application {
    mainClass = 'github.shkesar.TicTacToe.TicTacToe'
}
