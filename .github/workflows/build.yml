name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-desktop:
    name: Android APK + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests and build debug APK
        run: ./gradlew :composeApp:desktopTest :composeApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  macos:
    name: macOS desktop app (.dmg)
    runs-on: macos-14   # Apple Silicon; produces an arm64 app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build DMG
        run: ./gradlew :composeApp:packageDmg

      - uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-macos-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg

  ios:
    name: iOS Simulator build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run shared tests on iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build app for iOS Simulator (unsigned)
        working-directory: iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app
        working-directory: iosApp/build/Build/Products/Debug-iphonesimulator
        run: zip -qr "$GITHUB_WORKSPACE/TicTacToe-ios-simulator.zip" TicTacToe.app

      - uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-ios-simulator
          path: TicTacToe-ios-simulator.zip
